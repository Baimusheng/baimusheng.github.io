name: 发布博客到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: 获取源码
        uses: actions/checkout@v7
      - name: 准备 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: 获取 Pages 发布地址
        id: pages
        uses: actions/configure-pages@v6
      - name: 安装项目固定版本的 Hugo
        run: node scripts/setup.mjs
      - name: 构建博客
        env:
          BLOG_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: node scripts/hugo.mjs build
      - name: 检查构建产物
        run: node scripts/check.mjs
      - name: 上传静态文件
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v5
