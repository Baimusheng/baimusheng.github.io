<div id="search_menu_wrapper" class="hidden" role="dialog" aria-modal="true" aria-label="搜索文章">
  <div id="search_menu">
    <div id="search_menu_toolbar">
      <div id="search_menu_input_wrapper"><input id="search_menu_input" type="search" aria-label="搜索文章" placeholder="输入关键词，搜索文章" autocomplete="off"></div>
      <button id="search_menu_close_btn" type="button" aria-label="关闭搜索">{{ partial "svg/feather.html" (dict "name" "x" "height" "1.25rem" "width" "1.25rem") }}</button>
    </div>
    <div id="search_menu_results" aria-live="polite"></div>
  </div>
</div>
